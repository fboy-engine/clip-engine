name: clip
# Editing phase only: finds/downloads a window and builds ONE clip. Never posts.
# Manual trigger only (no cron). Plain Python CLI underneath, so this file is
# the only GitHub-specific part and can move to a self-hosted runner.
on:
  workflow_dispatch:
    inputs:
      url:
        description: YouTube stream URL (ended stream first)
        required: true
      campaign:
        description: Campaign label
        default: test
      start_sec:
        description: Window start (seconds)
        default: "0"
      end_sec:
        description: Window end (seconds); 0 = auto-find
        default: "0"
      live:
        description: Stream is live (clip from the DVR window)
        type: boolean
        default: false
      dry_run:
        description: Never post anywhere (always true for now)
        type: boolean
        default: true
      warp:
        description: Route yt-dlp through Cloudflare WARP
        type: boolean
        default: true
      cookies:
        description: Send the YT_COOKIES secret (off = anonymous via WARP)
        type: boolean
        default: false
      transcribe_models:
        description: Comma list of faster-whisper models to measure (empty = skip)
        default: ""
      large_max_sec:
        description: Cap audio seconds for large-v3 (0 = whole window)
        default: "120"
permissions:
  contents: read
concurrency:
  group: clip-engine-run
  cancel-in-progress: false
jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools (latest yt-dlp, JS runtime, ffmpeg)
        timeout-minutes: 6
        run: |
          if ! command -v ffmpeg >/dev/null; then
            APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
            sudo apt-get $APT update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get $APT install -y -qq --no-install-recommends ffmpeg
          fi
          pip install -q -U --default-timeout 30 --retries 2 "yt-dlp[default]"
          echo "yt-dlp $(yt-dlp --version) | node $(node --version) | $(ffmpeg -version | head -n1)"
      - name: Dry-run guard
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          [ "$DRY_RUN" = "true" ] || echo "note: posting is not built; running as dry run anyway"
      - name: WARP (egress check fails the job if IP did not change)
        if: ${{ inputs.warp }}
        timeout-minutes: 4
        run: bash scripts/warp_up.sh
      - name: Cookies (secret to temp file, names only in logs)
        if: ${{ inputs.cookies }}
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          umask 077
          printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/yt_cookies.txt"
          echo "YT_COOKIES_FILE=$RUNNER_TEMP/yt_cookies.txt" >> "$GITHUB_ENV"
          echo "cookie file lines: $(grep -vc '^#' "$RUNNER_TEMP/yt_cookies.txt" || true), youtube/google lines: $(grep -cE 'youtube|google' "$RUNNER_TEMP/yt_cookies.txt" || true)"
      - name: Stream info
        timeout-minutes: 4
        env:
          URL: ${{ inputs.url }}
        run: python -m clip_engine.cli info "$URL"
      - name: Download window
        timeout-minutes: 15
        env:
          URL: ${{ inputs.url }}
          START: ${{ inputs.start_sec }}
          END: ${{ inputs.end_sec }}
          LIVE: ${{ inputs.live }}
        run: |
          FLAGS=""; [ "$LIVE" = "true" ] && FLAGS="--live"
          python -m clip_engine.cli fetch "$URL" --start "$START" --end "$END" --out out $FLAGS
      - name: Upload download check (metadata only, no video)
        uses: actions/upload-artifact@v4
        with:
          name: dl-check-${{ github.run_id }}
          path: out/probe.json
      - name: Whisper cache key
        if: ${{ inputs.transcribe_models != '' }}
        id: wk
        env:
          MODELS: ${{ inputs.transcribe_models }}
        run: echo "key=whisper-$(echo "$MODELS" | tr ',' '-')-v1" >> "$GITHUB_OUTPUT"
      - name: Cache whisper models
        if: ${{ inputs.transcribe_models != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/clip-engine/models
          key: ${{ steps.wk.outputs.key }}
          restore-keys: whisper-
      - name: Install faster-whisper
        if: ${{ inputs.transcribe_models != '' }}
        timeout-minutes: 6
        run: |
          pip install -q --default-timeout 30 --retries 2 faster-whisper
          python -c "import faster_whisper, ctranslate2; print('faster-whisper', faster_whisper.__version__, '| ctranslate2', ctranslate2.__version__)"
      - name: Transcribe (one process per model so peak RSS is per model)
        if: ${{ inputs.transcribe_models != '' }}
        timeout-minutes: 30
        env:
          MODELS: ${{ inputs.transcribe_models }}
          LARGE_MAX: ${{ inputs.large_max_sec }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          RC=0
          for m in $(echo "$MODELS" | tr ',' ' '); do
            MAX=0; [ "$m" = "large-v3" ] && MAX="$LARGE_MAX"
            python -m clip_engine.cli transcribe out/source.mp4 --model "$m" --max-sec "$MAX" --language en --out out || RC=1
          done
          {
            echo '### Transcription metrics'
            for f in out/metrics_*.json; do [ -f "$f" ] && { echo '```json'; cat "$f"; echo '```'; }; done
            echo "cpus: $(nproc), mem: $(free -m | awk '/Mem:/{print $2}') MB"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC
      - name: Upload transcription results (json only, no video)
        if: ${{ always() && inputs.transcribe_models != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: asr-${{ github.run_id }}
          path: |
            out/metrics_*.json
            out/transcript_*.json
          if-no-files-found: warn
      - name: Cleanup secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/yt_cookies.txt"
          rm -rf "$RUNNER_TEMP/warp"

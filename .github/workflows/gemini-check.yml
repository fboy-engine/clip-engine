name: gemini-check
# One real Gemini call: walks the model chain until one answers. Manual only.
# The key is only ever sent to Google and never printed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gemini chain probe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PROBE_TIMEOUT: "20"
        run: python -m clip_engine.cli gemini-check

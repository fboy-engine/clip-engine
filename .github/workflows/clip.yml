name: clip
# Editing phase only: finds/downloads a window and builds ONE clip. Never posts.
# Manual trigger only (no cron). Plain Python CLI underneath, so this file is
# the only GitHub-specific part and can move to a self-hosted runner.
on:
  workflow_dispatch:
    inputs:
      url:
        description: YouTube stream URL (ended stream first)
        required: true
      campaign:
        description: Campaign label
        default: test
      start_sec:
        description: Window start (seconds)
        default: "0"
      end_sec:
        description: Window end (seconds); 0 = auto-find
        default: "0"
      live:
        description: Stream is live (clip from the DVR window)
        type: boolean
        default: false
      dry_run:
        description: Never post anywhere (always true for now)
        type: boolean
        default: true
      warp:
        description: Route yt-dlp through Cloudflare WARP
        type: boolean
        default: true
      cookies:
        description: Send the YT_COOKIES secret (off = anonymous via WARP)
        type: boolean
        default: false
      transcribe_models:
        description: Comma list of faster-whisper models to measure (empty = skip)
        default: ""
      large_max_sec:
        description: Cap audio seconds for large-v3 (0 = whole window)
        default: "120"
      find:
        description: Rank candidate moments in the window (signals, tiny/small ASR, Gemini gates)
        type: boolean
        default: false
      find_model:
        description: ASR model for candidate windows only (tiny or small)
        default: small
      find_top:
        description: How many signal-ranked windows to transcribe
        default: "8"
      gemini_model:
        description: Gemini model to try FIRST (empty = newest flash from ListModels)
        default: ""
      render:
        description: Render ONE clip from render_start-render_end (seconds in the window file), grade it
        type: boolean
        default: false
      render_start:
        description: Clip start, seconds in the window file (the find report's "file" times)
        default: "0"
      render_end:
        description: Clip end, seconds in the window file
        default: "0"
      hook_text:
        description: Cold-open hook caption (max 6 words; empty = pick a line from the speech)
        default: ""
      payoff_phrase:
        description: Phrase the clip should end on (empty = pick a payoff from audio and speech); render_end is the latest allowed end
        default: ""
      cam_corner:
        description: Facecam corner (bottom-left, bottom-right, top-left, top-right), empty = auto-find by face detection, none = gameplay-only
        default: ""
      cam_rect:
        description: Facecam rectangle x0,y0,x1,y1 as fractions of the frame (a person's pointer; trusted as the cam region, empty = auto)
        default: ""
      cache_only:
        description: Fail instead of downloading if the source cache misses
        type: boolean
        default: false
      cam_bench:
        description: Cam upscaler benchmark on the real cam crops (render_start/render_end = the window); implied by render
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: clip-engine-run
  cancel-in-progress: false
jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache static ffmpeg
        id: ffc
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-bin
          key: ffmpeg-btbn-linux64-gpl-v1
      - name: Install tools (static ffmpeg from GitHub releases, latest yt-dlp)
        timeout-minutes: 8
        run: |
          # apt ffmpeg pulls ~150 MB from the Azure mirror at a crawl on this image
          # (run 45 s per 10 MB package, hit the cap), so use a static build instead.
          echo "$(date +%T) start"
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            if [ ! -x "$HOME/ffmpeg-bin/ffmpeg" ] || [ ! -x "$HOME/ffmpeg-bin/ffprobe" ]; then
              mkdir -p "$HOME/ffmpeg-bin"
              echo "$(date +%T) download static ffmpeg"
              timeout 200 curl -fsSL --retry 2 --connect-timeout 15 -o /tmp/ffmpeg.tar.xz \
                "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
              ls -l /tmp/ffmpeg.tar.xz
              tar -xJf /tmp/ffmpeg.tar.xz -C "$HOME/ffmpeg-bin" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
            fi
            echo "$HOME/ffmpeg-bin" >> "$GITHUB_PATH"
            export PATH="$HOME/ffmpeg-bin:$PATH"
          fi
          echo "$(date +%T) pip yt-dlp"
          timeout 150 pip install -q -U --default-timeout 30 --retries 2 "yt-dlp[default]"
          echo "$(date +%T) done: yt-dlp $(yt-dlp --version) | node $(node --version) | $(ffmpeg -version | head -n1) | $(ffprobe -version | head -n1)"
      - name: Dry-run guard
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          [ "$DRY_RUN" = "true" ] || echo "note: posting is not built; running as dry run anyway"
      - name: Source cache key
        id: sk
        env:
          URL: ${{ inputs.url }}
          START: ${{ inputs.start_sec }}
          END: ${{ inputs.end_sec }}
        run: echo "key=src-$(printf '%s|%s|%s' "$URL" "$START" "$END" | sha1sum | cut -c1-16)-v1" >> "$GITHUB_OUTPUT"
      - name: Cache downloaded window (re-runs on the same window skip YouTube)
        id: srcc
        uses: actions/cache/restore@v4
        with:
          path: |
            out/source.mp4
            out/probe.json
          key: ${{ steps.sk.outputs.key }}
      - name: Source cache status
        run: |
          echo "source cache hit: ${{ steps.srcc.outputs.cache-hit }} key: ${{ steps.sk.outputs.key }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Cache-only guard (no download when asked not to)
        if: ${{ inputs.cache_only && steps.srcc.outputs.cache-hit != 'true' }}
        run: |
          echo "CACHE MISS for ${{ steps.sk.outputs.key }}; cache_only=true so nothing is downloaded"
          exit 1
      - name: WARP (egress check fails the job if IP did not change)
        if: ${{ inputs.warp && steps.srcc.outputs.cache-hit != 'true' }}
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/warp_up.sh
      - name: Cookies (secret to temp file, names only in logs)
        if: ${{ inputs.cookies && steps.srcc.outputs.cache-hit != 'true' }}
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          umask 077
          if [ -z "$YT_COOKIES" ]; then
            echo "YT_COOKIES secret is empty: add cookies from the throwaway Google account, or run with cookies=false"
            exit 1
          fi
          printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/yt_cookies.txt"
          YT=$(grep -cE 'youtube|google' "$RUNNER_TEMP/yt_cookies.txt" || true)
          echo "cookie file lines: $(grep -vc '^#' "$RUNNER_TEMP/yt_cookies.txt" || true), youtube/google lines: $YT"
          if [ "$YT" -eq 0 ]; then
            echo "YT_COOKIES has no youtube/google lines (wrong export or stale); refresh it from the throwaway account"
            exit 1
          fi
          echo "YT_COOKIES_FILE=$RUNNER_TEMP/yt_cookies.txt" >> "$GITHUB_ENV"
      - name: Stream info (metadata only; non-fatal, the download has its own client fallback)
        if: ${{ steps.srcc.outputs.cache-hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 4
        env:
          URL: ${{ inputs.url }}
        run: python -m clip_engine.cli info "$URL"
      - name: Download window
        if: ${{ steps.srcc.outputs.cache-hit != 'true' }}
        timeout-minutes: 15
        env:
          URL: ${{ inputs.url }}
          START: ${{ inputs.start_sec }}
          END: ${{ inputs.end_sec }}
          LIVE: ${{ inputs.live }}
        run: |
          FLAGS=""; [ "$LIVE" = "true" ] && FLAGS="--live"
          python -m clip_engine.cli fetch "$URL" --start "$START" --end "$END" --out out $FLAGS
      - name: Save downloaded window to cache now (do not wait for the whole job to pass)
        if: ${{ steps.srcc.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            out/source.mp4
            out/probe.json
          key: ${{ steps.sk.outputs.key }}
      - name: Upload download check (metadata only, no video)
        uses: actions/upload-artifact@v4
        with:
          name: dl-check-${{ github.run_id }}
          path: out/probe.json
      - name: Whisper cache key (find reuses the tiny-small-large-v3 cache)
        if: ${{ inputs.transcribe_models != '' || inputs.find || inputs.render }}
        id: wk
        env:
          MODELS: ${{ inputs.transcribe_models }}
        run: |
          M="${MODELS:-tiny,small,large-v3}"
          echo "key=whisper-$(echo "$M" | tr ',' '-')-v1" >> "$GITHUB_OUTPUT"
      - name: Cache whisper models
        if: ${{ inputs.transcribe_models != '' || inputs.find || inputs.render }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/clip-engine/models
          key: ${{ steps.wk.outputs.key }}
          restore-keys: whisper-
      - name: Install faster-whisper
        if: ${{ inputs.transcribe_models != '' || inputs.find || inputs.render }}
        timeout-minutes: 6
        run: |
          echo "$(date +%T) pip faster-whisper"
          timeout 330 pip install -q --default-timeout 30 --retries 2 faster-whisper
          python -c "import faster_whisper, ctranslate2; print('faster-whisper', faster_whisper.__version__, '| ctranslate2', ctranslate2.__version__)"
      - name: Transcribe (one process per model so peak RSS is per model)
        if: ${{ inputs.transcribe_models != '' }}
        timeout-minutes: 30
        env:
          MODELS: ${{ inputs.transcribe_models }}
          LARGE_MAX: ${{ inputs.large_max_sec }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          RC=0
          for m in $(echo "$MODELS" | tr ',' ' '); do
            MAX=0; [ "$m" = "large-v3" ] && MAX="$LARGE_MAX"
            python -m clip_engine.cli transcribe out/source.mp4 --model "$m" --max-sec "$MAX" --language en --out out || RC=1
          done
          {
            echo '### Transcription metrics'
            for f in out/metrics_*.json; do [ -f "$f" ] && { echo '```json'; cat "$f"; echo '```'; }; done
            echo "cpus: $(nproc), mem: $(free -m | awk '/Mem:/{print $2}') MB"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC
      - name: Find candidates (voice, audio peaks, silence, motion; ASR on candidates; Gemini gates)
        if: ${{ inputs.find }}
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          START: ${{ inputs.start_sec }}
          FIND_MODEL: ${{ inputs.find_model }}
          FIND_TOP: ${{ inputs.find_top }}
        run: python -m clip_engine.cli find out/source.mp4 --offset "$START" --model "$FIND_MODEL" --top "$FIND_TOP" --out out
      - name: Install opencv 4.x contrib + onnxruntime (render / cam bench; OpenCV 5 removed CascadeClassifier)
        if: ${{ inputs.render || inputs.cam_bench }}
        timeout-minutes: 6
        run: |
          timeout 300 pip install -q --default-timeout 30 --retries 2 "opencv-contrib-python-headless>=4.9,<5" "onnxruntime>=1.17"
          python -c "import cv2, onnxruntime; print('opencv', cv2.__version__, '| dnn_superres', hasattr(cv2, 'dnn_superres'), '| onnxruntime', onnxruntime.__version__)"
      - name: Feature check (fail fast before the render starts)
        if: ${{ inputs.render || inputs.cam_bench }}
        timeout-minutes: 2
        run: python -m clip_engine.cli check-cv
      - name: Cache super-resolution models (SHA-256 pinned in code)
        if: ${{ inputs.render || inputs.cam_bench }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/clip-engine/sr
          key: sr-models-v1
      - name: Cam upscaler benchmark (real cam crops of the cached source; metadata-only format listing, no media download)
        if: ${{ inputs.render || inputs.cam_bench }}
        timeout-minutes: 25
        env:
          RSTART: ${{ inputs.render_start }}
          REND: ${{ inputs.render_end }}
          SRCURL: ${{ inputs.url }}
        run: |
          python -m clip_engine.cli cam-bench out/source.mp4 --start "$RSTART" --end "$REND" --vod-id "$SRCURL" --url "$SRCURL" --formats --out out
      - name: Upload cam benchmark (json, table, cam_compare.png)
        if: ${{ always() && inputs.cam_bench && !inputs.render }}
        uses: actions/upload-artifact@v4
        with:
          name: cambench-${{ github.run_id }}
          path: |
            out/cam_bench.json
            out/cam_bench.md
            out/cam_compare.png
          retention-days: 14
          if-no-files-found: warn
      - name: Render clip (cam on top, subject-tracked gameplay panel, captions, hook, -14 LUFS) and grade it
        if: ${{ inputs.render }}
        timeout-minutes: 35
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          RSTART: ${{ inputs.render_start }}
          REND: ${{ inputs.render_end }}
          HOOK: ${{ inputs.hook_text }}
          CAM: ${{ inputs.cam_corner }}
          CAMRECT: ${{ inputs.cam_rect }}
          PAYOFF: ${{ inputs.payoff_phrase }}
          SRCURL: ${{ inputs.url }}
        run: |
          ARGS=()
          [ -n "$SRCURL" ] && ARGS+=(--vod-id "$SRCURL")
          [ -n "$CAM" ] && ARGS+=(--cam-corner "$CAM")
          [ -n "$CAMRECT" ] && ARGS+=(--cam-rect "$CAMRECT")
          [ -n "$PAYOFF" ] && ARGS+=(--payoff "$PAYOFF")
          python -m clip_engine.cli render out/source.mp4 --start "$RSTART" --end "$REND" --hook "$HOOK" "${ARGS[@]}" --out out
      - name: Upload the clip (MP4, render/grade json, review frames)
        if: ${{ always() && inputs.render }}
        uses: actions/upload-artifact@v4
        with:
          name: clip-${{ github.run_id }}
          path: |
            out/clip.mp4
            out/clip.ass
            out/render.json
            out/layout.json
            out/cam_bench.json
            out/cam_bench.md
            out/cam_compare.png
            out/grade.json
            out/cam_diag.json
            out/source_contact.jpg
            out/source_frame_*.jpg
            out/render_error.json
            out/encode.log
            out/review/*.jpg
          retention-days: 14
          if-no-files-found: warn
      - name: Upload candidates (json only, no video)
        if: ${{ always() && inputs.find }}
        uses: actions/upload-artifact@v4
        with:
          name: find-${{ github.run_id }}
          path: out/candidates.json
          if-no-files-found: warn
      - name: Upload transcription results (json only, no video)
        if: ${{ always() && inputs.transcribe_models != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: asr-${{ github.run_id }}
          path: |
            out/metrics_*.json
            out/transcript_*.json
          if-no-files-found: warn
      - name: Cleanup secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/yt_cookies.txt"
          rm -rf "$RUNNER_TEMP/warp"

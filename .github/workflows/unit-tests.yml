name: unit-tests
# Tests only: stdlib unittest. Synthetic data plus one small ffmpeg-made test video (tests/test_cam_real_video.py). No downloads.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -q numpy opencv-python-headless
      - run: python -m unittest discover -s tests -v
